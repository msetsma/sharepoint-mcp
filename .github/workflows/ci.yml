name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag after v7, so pin the release.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - run: uv run --frozen test_server.py
